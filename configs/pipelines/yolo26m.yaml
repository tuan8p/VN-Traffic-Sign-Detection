# Owner: Team pipeline YOLO26m + preprocessing online.
# Online ops below only run when enabled is true.
# Do not set train.batch_size or eval.batch_size here. Both come from configs/shared.yaml.
# Team YOLO: pass the shared train and eval totals from configs/shared.yaml to Ultralytics. Do not divide them.
pipeline: yolo26m
inherits: configs/shared.yaml

model:
  family: yolo
  weights: yolo26m.pt
  imgsz: 640  # B0 default; B2: 960 on the same cache
  # Match Faster R-CNN COCOeval postprocess for comparable test metrics.
  score_thresh: 0.001
  nms_thresh: 0.5
  detections_per_img: 100

train:
  epochs: 100
  freeze: 0  # 0 = full fine-tune; N = freeze first N layers; [0, 1, 2] = specific layers
  # Explicit AdamW: Ultralytics optimizer=auto ignores lr0/momentum and picked
  # AdamW lr~0.000179 internally. lr0 below is the AdamW-scale LR, not SGD 0.01.
  optimizer: AdamW
  lr0: 0.0002
  momentum: 0.9
  weight_decay: 0.0005
  lrf: 0.01
  warmup_epochs: 3.0
  cos_lr: true
  close_mosaic: 10  # A2: 20
  multi_scale: 0.0  # B1: 0.10 (independent of online_preprocess.enabled)
  cls_pw: 0.0  # C1: 0.25; fails explicitly if Ultralytics lacks support
  class_aware_sampling:  # C2: enable only this option for the sampling ablation
    enabled: false
    power: 0.25
    max_weight: 2.0
  primary_metric: mAP50-95

online_preprocess:
  enabled: true
  letterbox: true
  normalize: true
  hflip: false
  color_jitter: true
  mosaic: true
  mixup: false
  jitter: 0.1
  mosaic_prob: 1.0  # A1: 0.5; applies only if enabled=true and mosaic=true
  mixup_prob: 0.1  # C3: set mixup=true and probability=0.05
  mixup_alpha: 32.0
  color_jitter_params: {brightness: 0.2, contrast: 0.2, saturation: 0.2, hue: 0.02}
