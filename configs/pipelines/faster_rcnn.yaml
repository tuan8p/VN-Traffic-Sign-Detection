# Owner: Team pipeline Faster R-CNN + preprocessing online.
# Online ops below only run when enabled is true.
# Do not set train.batch_size or eval.batch_size here. Both come from configs/shared.yaml.
pipeline: faster_rcnn
inherits: configs/shared.yaml

model:
  family: faster_rcnn
  backbone: resnet50
  pretrained: true
  # Team Faster R-CNN: 52 is the dataset. Box predictor must be 53 (plus background).
  # DataLoader must use per_rank_batch so the shared total is not applied on every GPU.
  num_classes: 52
  # Added RoI projection layers; use standard for the unchanged predictor baseline.
  head: custom_mlp
  head_hidden_dim: 512
  head_dropout: 0.2
  weights: FasterRCNN_ResNet50_FPN_Weights.COCO_V1
  trainable_backbone_layers: 5
  frozen_bn_eps: 0.0
  score_thresh: 0.001
  nms_thresh: 0.5
  detections_per_img: 12

train:
  epochs: 100
  lr: 0.005
  momentum: 0.9
  weight_decay: 0.0005
  primary_metric: mAP50-95
  scheduler: cosine
  warmup_epochs: 5
  warmup_start_factor: 0.001
  min_lr: 0.000001

online_preprocess:
  enabled: false
  letterbox: true
  normalize: true
  hflip: false
  color_jitter: false
  mosaic: false
  mixup: false
  jitter: 0.1
  mosaic_prob: 1.0
  mixup_prob: 0.1
  mixup_alpha: 32.0
  color_jitter_params: {brightness: 0.2, contrast: 0.2, saturation: 0.2, hue: 0.02}
