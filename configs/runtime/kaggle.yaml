runtime: kaggle
device: cuda
# Kaggle Models → Ultralytics YOLO26 (attach once per notebook; no download).
yolo_pretrained: /kaggle/input/models/ultralytics/yolo26/pytorch/default/1/yolo26m.pt
# Default processed cache when using Add Data → zero001206/... on Kaggle.
data_root_default: /kaggle/input/datasets/zero001206/vn-traffic-sign-detection-preprocessed-data/processed
# YOLO: notebook §6 symlink staging → label cache on Working (stable 2×GPU DDP).
yolo_readonly_data: false
num_workers: 2
pin_memory: true
gpus: 2
mixed_precision: true
# torchrun --nproc_per_node=2, same DDP mode as the classification DL pipeline.

# Allows initial dataset scan on rank 0 before workers synchronize.
ddp_timeout_seconds: 1800
