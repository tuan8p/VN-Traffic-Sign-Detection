[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vn-tsd"
version = "0.1.0"
description = "Vietnamese traffic-sign detection — Faster R-CNN ResNet-50 and YOLO26m (IPCV)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "IPCV team" }]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "opencv-python-headless>=4.8",
  "Pillow>=10.0",
  "PyYAML>=6.0",
  "tqdm>=4.66",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
detect = ["torch>=2.1", "torchvision>=0.16", "ultralytics>=8.3"]
demo = ["streamlit>=1.28"]
dev = ["pytest>=7.4"]
all = ["vn-tsd[detect,demo,dev]"]

[project.scripts]
vn-tsd-preprocess = "tools.run_preprocess:main"
vn-tsd-train = "tools.run_train:main"
vn-tsd-eval = "tools.run_eval:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["vn_tsd*", "tools*", "analysis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["win-64"]

[tool.pixi.pypi-dependencies]
vn-tsd = { path = ".", editable = true }

# Keep every generated environment on a Python ABI supported by PyTorch.
[tool.pixi.dependencies]
python = "3.11.*"

[tool.pixi.environments]
default = { solve-group = "default" }
all = { features = ["all"], solve-group = "default" }
demo = { features = ["demo"], solve-group = "default" }
detect = { features = ["detect"], solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }
frcnn = { features = ["frcnn", "dev"], solve-group = "frcnn" }

[tool.pixi.tasks]

# Local development and smoke tests; full training runs on Kaggle.
[tool.pixi.feature.frcnn.pypi-dependencies]
torch = { version = ">=2.1,<3", index = "https://download.pytorch.org/whl/cu128" }
torchvision = { version = ">=0.16,<1", index = "https://download.pytorch.org/whl/cu128" }
wandb = ">=0.17,<1"
pycocotools = ">=2.0.7,<3"
ipykernel = ">=6,<8"

[tool.pixi.feature.frcnn.tasks]
test = "python -m pytest -q"
